<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1B3D">
<meta name="mobile-web-app-capable" content="yes">
<title>דינו סוגר שטחים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Rubik:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="title" class="screen title-bg">
  <div class="title-inner">
    <div class="logo">דינו<br><span>סוגר שטחים!</span></div>
    <canvas id="titleHero" class="hero bob" aria-hidden="true"></canvas>
    <button id="playBtn" class="btn big">שחק!</button>
    <div class="chars-box">
      <div id="chars" class="chars"></div>
      <div id="charPerk" class="perk"></div>
      <button id="shopBtn" class="btn alt shop-btn">👕 המלתחה <span id="titleGems" class="gem-pill"></span></button>
    </div>
  </div>
  <button id="muteBtn" class="icon-btn corner" aria-label="צליל">🔊</button>
  <button id="settingsBtn" class="icon-btn corner end" aria-label="הגדרות">⚙️</button>

  <div id="settings" class="overlay" hidden>
    <div class="panel">
      <h2>הגדרות</h2>
      <div id="resetAsk" class="settings-step">
        <button id="resetBtn" class="btn alt">איפוס התקדמות</button>
        <button id="settingsClose" class="btn">סגירה</button>
      </div>
      <div id="resetConfirm" class="settings-step" hidden>
        <p class="warn">בטוחים? כל הכוכבים, השלבים והדמויות שנפתחו יימחקו, ואי אפשר לבטל את זה.</p>
        <button id="resetYes" class="btn danger">כן, לאפס הכול</button>
        <button id="resetNo" class="btn alt">ביטול</button>
      </div>
      <p id="resetDone" class="done" hidden>ההתקדמות אופסה. מתחילים מההתחלה!</p>
    </div>
  </div>
</section>

<section id="shop" class="screen" hidden>
  <header class="shop-head">
    <button id="shopBack" class="icon-btn" aria-label="חזרה">→</button>
    <h1>המלתחה</h1>
    <span id="shopGems" class="gem-pill big"></span>
  </header>
  <div class="shop-stage">
    <button id="shopPrev" class="icon-btn small" aria-label="הדינו הקודם">→</button>
    <canvas id="shopHero" class="shop-hero" aria-hidden="true"></canvas>
    <button id="shopNext" class="icon-btn small" aria-label="הדינו הבא">←</button>
  </div>
  <div class="shop-action">
    <div id="shopItemName" class="shop-item-name"></div>
    <button id="shopBuy" class="btn" hidden></button>
  </div>
  <div class="shop-tabs" role="tablist">
    <button class="tab" data-slot="head">🎩 כובעים</button>
    <button class="tab" data-slot="face">😎 פנים</button>
    <button class="tab" data-slot="body">🎀 גוף</button>
  </div>
  <div id="shopGrid" class="shop-grid"></div>
</section>

<section id="map" class="screen" hidden>
  <div id="mapStage" class="map-stage">
    <img id="mapBg" class="map-bg" alt="">
    <div id="levels" class="levels"></div>
    <img id="mapPrize" class="map-prize" alt="">
  </div>
  <header class="map-head">
    <button id="mapBack" class="icon-btn" aria-label="חזרה">→</button>
    <h1 id="worldName"></h1>
  </header>
  <div id="worldLocked" class="world-locked" hidden></div>
  <div id="levelInfo" class="overlay" hidden>
    <div class="panel level-info">
      <button id="infoClose" class="icon-btn small info-close" aria-label="סגירה">✕</button>
      <img id="infoFace" class="info-face" alt="" hidden>
      <div id="infoWorld" class="info-world"></div>
      <h2 id="infoTitle"></h2>
      <div id="infoGoal" class="info-goal"></div>
      <div id="infoStars" class="stars-big small"></div>
      <div id="infoBest" class="info-best"></div>
      <div id="infoTimes" class="info-times"></div>
      <div id="infoChal"></div>
      <button id="infoPlay" class="btn big">שחק!</button>
    </div>
  </div>
  <div class="world-nav">
    <button id="prevWorld" class="icon-btn" aria-label="עולם קודם">→</button>
    <span id="worldNum"></span>
    <button id="nextWorld" class="icon-btn" aria-label="עולם הבא">←</button>
  </div>
</section>

<section id="game" class="screen" hidden>
  <div class="hud">
    <button id="pauseBtn" class="icon-btn small" aria-label="הפסקה">❚❚</button>
    <div id="lives" class="lives"></div>
    <div class="level-box">
      <div id="levelName" class="level-name"></div>
      <div id="timer" class="timer">⏱ <bdi id="timerNum">0:00</bdi></div>
    </div>
    <div class="meter">
      <div class="meter-bar"><div id="meterFill" class="meter-fill"></div><div id="meterGoal" class="meter-goal"></div></div>
      <div id="meterNum" class="meter-num"></div>
    </div>
  </div>
  <div id="boardWrap" class="board-wrap">
    <canvas id="cv"></canvas>
    <div id="banner" class="banner" hidden></div>
  </div>
  <div id="hint" class="hint" hidden></div>
  <div id="pad" class="pad" aria-label="חיצים">
    <div class="arr up" data-d="up"><svg viewBox="0 0 24 24"><path d="M12 5 L20 17 L4 17 Z"/></svg></div>
    <div class="arr right" data-d="right"><svg viewBox="0 0 24 24"><path d="M19 12 L7 20 L7 4 Z"/></svg></div>
    <div class="arr down" data-d="down"><svg viewBox="0 0 24 24"><path d="M12 19 L4 7 L20 7 Z"/></svg></div>
    <div class="arr left" data-d="left"><svg viewBox="0 0 24 24"><path d="M5 12 L17 4 L17 20 Z"/></svg></div>
  </div>
  <div id="stick" class="stick" hidden><div id="knob" class="knob"></div></div>

  <div id="pause" class="overlay" hidden>
    <div class="panel">
      <h2>הפסקה</h2>
      <button id="resumeBtn" class="btn">ממשיכים</button>
      <button id="restartBtn" class="btn alt">מתחילים מחדש</button>
      <button id="pauseMapBtn" class="btn alt">למפה</button>
      <button id="pauseHomeBtn" class="btn alt">🏠 למסך הראשי</button>
      <button id="pauseMuteBtn" class="btn alt"></button>
    </div>
  </div>

  <div id="win" class="overlay bottom" hidden>
    <div class="panel">
      <h2 id="winTitle">כל הכבוד!</h2>
      <div id="winStars" class="stars-big"></div>
      <div id="winTime" class="time-row"></div>
      <div id="winChal"></div>
      <div id="winScore" class="score"></div>
      <div id="unlock" class="unlock" hidden>
        <div class="unlock-row">
          <img id="unlockImg" alt="">
          <div id="unlockText"></div>
        </div>
        <button id="pickBtn" class="btn pick"></button>
      </div>
      <button id="nextBtn" class="btn">לשלב הבא</button>
      <button id="winRetryBtn" class="btn alt">שוב</button>
      <button id="winMapBtn" class="btn alt">למפה</button>
    </div>
  </div>

  <div id="lose" class="overlay" hidden>
    <div class="panel">
      <img id="loseImg" class="sad" src="assets/pip.svg" alt="">
      <h2>אוי! הביצים נגמרו</h2>
      <button id="retryBtn" class="btn">ננסה שוב!</button>
      <button id="loseMapBtn" class="btn alt">למפה</button>
    </div>
  </div>
</section>

<script src="outfits.js"></script>
<script src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1B3D">
<meta name="mobile-web-app-capable" content="yes">
<title>דינו-גיים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Rubik:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="hub" class="screen title-bg" hidden>
  <div class="hub-inner">
    <div class="logo hub-logo">דינו-<span>גיים</span></div>
    <canvas id="hubHero" class="hero hub-hero bob" aria-hidden="true"></canvas>
    <div class="game-cards">
      <button class="game-card dig" data-game="dig">
        <svg class="card-art" viewBox="0 0 120 90" aria-hidden="true">
          <rect x="4" y="4" width="112" height="82" rx="14" fill="#A0673F" stroke="#2B1B3D" stroke-width="4"/>
          <path d="M4 18 Q4 4 18 4 H70 V40 H40 V86 H18 Q4 86 4 72 Z" fill="#5CCB5F" stroke="#2B1B3D" stroke-width="4" stroke-linejoin="round"/>
          <path d="M70 40 H96 V64 H40" fill="none" stroke="#FFD23F" stroke-width="5" stroke-dasharray="7 6" stroke-linecap="round"/>
          <circle cx="40" cy="64" r="7" fill="#FFD23F" stroke="#2B1B3D" stroke-width="3"/>
        </svg>
        <span class="card-name">דינו<br>סוגר שטחים</span>
        <span class="card-stars"></span>
      </button>
      <button class="game-card blocks" data-game="blocks">
        <svg class="card-art" viewBox="0 0 120 90" aria-hidden="true">
          <rect x="4" y="4" width="112" height="82" rx="14" fill="#3A2E5A" stroke="#2B1B3D" stroke-width="4"/>
          <g stroke="#2B1B3D" stroke-width="3">
            <rect x="46" y="10" width="18" height="18" rx="4" fill="#B07CE8"/><rect x="28" y="28" width="18" height="18" rx="4" fill="#B07CE8"/>
            <rect x="46" y="28" width="18" height="18" rx="4" fill="#B07CE8"/><rect x="64" y="28" width="18" height="18" rx="4" fill="#B07CE8"/>
            <rect x="10" y="64" width="18" height="18" rx="4" fill="#4FC3F7"/><rect x="28" y="64" width="18" height="18" rx="4" fill="#FFD23F"/>
            <rect x="46" y="64" width="18" height="18" rx="4" fill="#FFD23F"/><rect x="82" y="64" width="18" height="18" rx="4" fill="#5CCB5F"/>
            <rect x="100" y="64" width="12" height="18" rx="4" fill="#5CCB5F"/><rect x="82" y="46" width="18" height="18" rx="4" fill="#FF6B7A"/>
            <rect x="100" y="46" width="12" height="18" rx="4" fill="#FF6B7A"/>
          </g>
        </svg>
        <span class="card-name">דינו<br>בלוקים</span>
        <span class="card-stars"></span>
      </button>
    </div>
    <button id="hubShopBtn" class="btn alt shop-btn">👕 המלתחה <span id="hubGems" class="gem-pill"></span></button>
  </div>
  <button id="muteBtn" class="icon-btn corner" aria-label="צליל">🔊</button>
  <button id="settingsBtn" class="icon-btn corner end" aria-label="הגדרות">⚙️</button>

  <div id="settings" class="overlay" hidden>
    <div class="panel">
      <h2>הגדרות</h2>
      <div id="resetAsk" class="settings-step">
        <button id="resetBtn" class="btn alt">איפוס התקדמות</button>
        <button id="settingsClose" class="btn">סגירה</button>
      </div>
      <div id="resetConfirm" class="settings-step" hidden>
        <p class="warn">בטוחים? כל הכוכבים, השלבים והדמויות שנפתחו יימחקו, ואי אפשר לבטל את זה.</p>
        <button id="resetYes" class="btn danger">כן, לאפס הכול</button>
        <button id="resetNo" class="btn alt">ביטול</button>
      </div>
      <p id="resetDone" class="done" hidden>ההתקדמות אופסה. מתחילים מההתחלה!</p>
    </div>
  </div>
</section>

<section id="title" class="screen title-bg" hidden>
  <div class="title-inner">
    <div id="titleLogo" class="logo">דינו<br><span>סוגר שטחים!</span></div>
    <canvas id="titleHero" class="hero bob" aria-hidden="true"></canvas>
    <button id="playBtn" class="btn big">שחק!</button>
    <div class="chars-box">
      <div id="chars" class="chars"></div>
      <div id="charPerk" class="perk"></div>
      <button id="shopBtn" class="btn alt shop-btn">👕 המלתחה <span id="titleGems" class="gem-pill"></span></button>
    </div>
  </div>
  <button id="titleHome" class="home-btn" aria-label="לכל המשחקים">
    <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M6 25 L24 8 L42 25 L37 25 L37 40 L11 40 L11 25 Z"/><rect class="fill door" x="20" y="28" width="8" height="12" rx="3"/></svg>
  </button>
</section>

<section id="shop" class="screen" hidden>
  <header class="shop-head">
    <h1>המלתחה</h1>
    <span id="shopGems" class="gem-pill big"></span>
  </header>
  <div class="shop-stage">
    <button id="shopPrev" class="icon-btn small" aria-label="הדינו הקודם">→</button>
    <canvas id="shopHero" class="shop-hero" aria-hidden="true"></canvas>
    <button id="shopNext" class="icon-btn small" aria-label="הדינו הבא">←</button>
  </div>
  <div class="shop-action">
    <div id="shopItemName" class="shop-item-name"></div>
    <button id="shopBuy" class="btn" hidden></button>
  </div>
  <div class="shop-tabs" role="tablist">
    <button class="tab" data-slot="head">🎩 כובעים</button>
    <button class="tab" data-slot="face">😎 פנים</button>
    <button class="tab" data-slot="body">🎀 גוף</button>
  </div>
  <div id="shopGrid" class="shop-grid"></div>
  <button id="shopBack" class="home-btn" aria-label="למסך הראשי">
    <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M6 25 L24 8 L42 25 L37 25 L37 40 L11 40 L11 25 Z"/><rect class="fill door" x="20" y="28" width="8" height="12" rx="3"/></svg>
  </button>
</section>

<section id="map" class="screen" hidden>
  <div id="mapStage" class="map-stage">
    <img id="mapBg" class="map-bg" alt="">
    <div id="levels" class="levels"></div>
    <img id="mapPrize" class="map-prize" alt="">
  </div>
  <header class="map-head">
    <h1 id="worldName"></h1>
  </header>
  <div id="worldLocked" class="world-locked" hidden></div>
  <div id="levelInfo" class="overlay" hidden>
    <div class="panel level-info">
      <button id="infoClose" class="icon-btn small info-close" aria-label="סגירה">✕</button>
      <img id="infoFace" class="info-face" alt="" hidden>
      <div id="infoWorld" class="info-world"></div>
      <h2 id="infoTitle"></h2>
      <div id="infoGoal" class="info-goal"></div>
      <div id="infoStars" class="stars-big small"></div>
      <div id="infoBest" class="info-best"></div>
      <div id="infoTimes" class="info-times"></div>
      <div id="infoChal"></div>
      <button id="infoPlay" class="btn big">שחק!</button>
    </div>
  </div>
  <div class="world-nav">
    <button id="prevWorld" class="icon-btn" aria-label="עולם קודם">→</button>
    <span id="worldNum"></span>
    <button id="nextWorld" class="icon-btn" aria-label="עולם הבא">←</button>
  </div>
  <button id="mapBack" class="home-btn" aria-label="למסך הראשי">
    <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M6 25 L24 8 L42 25 L37 25 L37 40 L11 40 L11 25 Z"/><rect class="fill door" x="20" y="28" width="8" height="12" rx="3"/></svg>
  </button>
</section>

<section id="game" class="screen" hidden>
  <div class="hud">
    <button id="pauseBtn" class="icon-btn small" aria-label="הפסקה">❚❚</button>
    <div id="lives" class="lives"></div>
    <div class="level-box">
      <div id="levelName" class="level-name"></div>
      <div id="timer" class="timer">⏱ <bdi id="timerNum">0:00</bdi></div>
    </div>
    <div class="meter">
      <div class="meter-bar"><div id="meterFill" class="meter-fill"></div><div id="meterGoal" class="meter-goal"></div></div>
      <div id="meterNum" class="meter-num"></div>
    </div>
  </div>
  <div id="boardWrap" class="board-wrap">
    <canvas id="cv"></canvas>
    <canvas id="bcv"></canvas>
    <div id="banner" class="banner" hidden></div>
  </div>
  <div id="hint" class="hint" hidden></div>
  <div id="pad" class="pad" aria-label="חיצים">
    <div class="arr up" data-d="up"><svg viewBox="0 0 24 24"><path d="M12 5 L20 17 L4 17 Z"/></svg></div>
    <div class="arr right" data-d="right"><svg viewBox="0 0 24 24"><path d="M19 12 L7 20 L7 4 Z"/></svg></div>
    <div class="arr down" data-d="down"><svg viewBox="0 0 24 24"><path d="M12 19 L4 7 L20 7 Z"/></svg></div>
    <div class="arr left" data-d="left"><svg viewBox="0 0 24 24"><path d="M5 12 L17 4 L17 20 Z"/></svg></div>
  </div>
  <div id="bpad" class="bpad" dir="ltr" hidden>
    <div class="bpad-move">
      <button class="bk" data-k="left" aria-label="שמאלה"><svg viewBox="0 0 24 24"><path d="M5 12 L17 4 L17 20 Z"/></svg></button>
      <button class="bk" data-k="down" aria-label="מהר למטה"><svg viewBox="0 0 24 24"><path d="M12 19 L4 7 L20 7 Z"/></svg></button>
      <button class="bk" data-k="right" aria-label="ימינה"><svg viewBox="0 0 24 24"><path d="M19 12 L7 20 L7 4 Z"/></svg></button>
    </div>
    <div class="bpad-act">
      <button class="bk drop" data-k="drop" aria-label="להפיל"><svg viewBox="0 0 24 24"><path d="M12 21 L5 13 H19 Z M12 13 L5 5 H19 Z"/></svg></button>
      <button class="bk rot" data-k="rot" aria-label="לסובב"><svg viewBox="0 0 48 48"><path class="o" d="M35.3 17.5 A13 13 0 1 0 36.2 28.4"/><path class="i" d="M35.3 17.5 A13 13 0 1 0 36.2 28.4"/><path d="M38.6 20 L43 31.5 L30 27.5 Z"/></svg></button>
    </div>
  </div>

  <div id="pause" class="overlay" hidden>
    <div class="panel pause-panel">
      <div class="pause-nap" aria-hidden="true"><img id="pauseDino" alt=""><span class="zz">z<i>z</i><b>z</b></span></div>
      <h2>הפסקה</h2>
      <button id="resumeBtn" class="btn resume">
        <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M15 9 L39 24 L15 39 Z"/></svg>
        ממשיכים
      </button>
      <div class="pause-grid">
        <button id="restartBtn" class="ptile t-restart">
          <svg class="ic" viewBox="0 0 48 48"><path class="o" d="M35.3 17.5 A13 13 0 1 0 36.2 28.4"/><path class="i" d="M35.3 17.5 A13 13 0 1 0 36.2 28.4"/><path class="fill" d="M38.6 20 L43 31.5 L30 27.5 Z"/></svg>
          <span>מחדש</span>
        </button>
        <button id="pauseMapBtn" class="ptile t-map">
          <svg class="ic" viewBox="0 0 48 48"><path class="fill paper" d="M5 12 L17 8 L31 12 L43 8 L43 36 L31 40 L17 36 L5 40 Z"/><path class="line" d="M17 8 V36 M31 12 V40"/><path class="dash" d="M10 33 Q16 22 24 26 T34 19"/><path class="x" d="M33 15 L39 21 M39 15 L33 21"/></svg>
          <span>מפה</span>
        </button>
        <button id="pauseHomeBtn" class="ptile t-home">
          <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M6 25 L24 8 L42 25 L37 25 L37 40 L11 40 L11 25 Z"/><rect class="fill door" x="20" y="28" width="8" height="12" rx="3"/></svg>
          <span>בית</span>
        </button>
      </div>
      <div class="pause-row">
        <button id="pauseMuteBtn" class="round-toggle" aria-label="צליל">
          <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M7 19 H15 L26 10 V38 L15 29 H7 Z"/><g class="on-only"><path class="line" d="M31 18 Q35 24 31 30"/><path class="line" d="M35 13 Q43 24 35 35"/></g><path class="x off-only" d="M32 19 L42 29 M42 19 L32 29"/></svg>
        </button>
        <div id="controlSeg" class="seg" role="radiogroup" aria-label="שליטה">
          <span class="thumb" aria-hidden="true"></span>
          <button data-m="pad" role="radio">
            <svg class="ic" viewBox="0 0 48 48"><path class="fill" d="M18 6 H30 V18 H42 V30 H30 V42 H18 V30 H6 V18 H18 Z"/><circle class="dot" cx="24" cy="24" r="3.5"/></svg>
            חיצים
          </button>
          <button data-m="swipe" role="radio">
            <svg class="ic" viewBox="0 0 48 48"><path class="o" d="M10 34 Q20 14 36 14"/><path class="i" d="M10 34 Q20 14 36 14"/><path class="fill" d="M34 6 L45 14 L34 22 Z"/><circle class="fill tip" cx="10" cy="35" r="6"/></svg>
            החלקה
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="win" class="overlay bottom" hidden>
    <div class="panel">
      <h2 id="winTitle">כל הכבוד!</h2>
      <div id="winStars" class="stars-big"></div>
      <div id="winTime" class="time-row"></div>
      <div id="winChal"></div>
      <div id="winScore" class="score"></div>
      <div id="unlock" class="unlock" hidden>
        <div class="unlock-row">
          <img id="unlockImg" alt="">
          <div id="unlockText"></div>
        </div>
        <button id="pickBtn" class="btn pick"></button>
      </div>
      <button id="nextBtn" class="btn">לשלב הבא</button>
      <button id="winRetryBtn" class="btn alt">שוב</button>
      <button id="winMapBtn" class="btn alt">למפה</button>
    </div>
  </div>

  <div id="lose" class="overlay" hidden>
    <div class="panel">
      <img id="loseImg" class="sad" src="assets/pip.svg" alt="">
      <h2>אוי! הביצים נגמרו</h2>
      <button id="retryBtn" class="btn">ננסה שוב!</button>
      <button id="loseMapBtn" class="btn alt">למפה</button>
    </div>
  </div>
</section>

<script src="outfits.js"></script>
<script src="blocks.js"></script>
<script src="game.js"></script>
</body>
</html>
